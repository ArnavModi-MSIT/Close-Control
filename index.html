<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Close Control — Razorpay Buildathon, Track 04</title>
  <!-- GitHub Pages serves this repo from its root, but the showcase page
       itself lives in ui/ (alongside the styles.css and script.js it loads
       by relative path, so moving it would break those). This redirect gives
       the Pages root URL a real landing page instead of a 404, without
       relocating anything. The <a> below is the no-JS / no-meta-refresh
       fallback -- it is never normally seen. -->

  <link rel="canonical" href="ui/showcase.html">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #12100E; color: #F5F1EA;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center; padding: 2rem; box-sizing: border-box;
    }
    a { color: #E8A87C; }
  </style>
</head>
<body>
  <p>
    Redirecting to the <a href="ui/showcase.html">Close Control showcase</a>&hellip;
  </p>
</body>
</html>
